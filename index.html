<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encoded Narratives</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,680;1,9..144,460&family=Newsreader:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="hut-page" id="hutPage">
  <header>
    <div class="mark">Encoded Narratives</div>
    <div class="sub">NGUNI BEADWORK &amp; THE WOMEN WHO WORE IT</div>
  </header>

  <div class="hut-stage" id="hutStage">
    <div class="hut">
      <div class="hut-roof"></div>
      <div class="hut-body"></div>
      <div class="door" id="door" role="button" tabindex="0" aria-label="Enter Queen Lozikeyi Dlodlo’s story"><span>ENTER</span></div>
    </div>
  </div>

  <div class="hut-caption">
    <div class="name">Queen Lozikeyi Dlodlo</div>
    <div class="blurb">Senior queen of the Ndebele, and the strategist behind an uprising the British never expected.</div>
  </div>

  <div class="hut-foot"><a href="learn-more.html">LEARN MORE.</a></div>
  <div class="door-overlay"></div>

  <script>
    (function(){
      var page=document.getElementById('hutPage'), door=document.getElementById('door'), going=false;
      function enter(){ if(going) return; going=true; page.classList.add('is-entering'); setTimeout(function(){ location.href='story.html'; },650); }
      door.addEventListener('click',enter);
      door.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); enter(); } });
    })();
  </script>
</body>
</html>
